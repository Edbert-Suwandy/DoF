<div>
    <form>
        <label for="search" style="margin-right: 10px;">Member Name: </label>
        <select (change)="handleSelectionChange($event)">
            <option *ngFor="let ba of allBa()">{{ba.Business_Area}}</option>
        </select>
        <label for="from" style="margin-right: 10px;">from: </label>
        <input type="date" (change)="handleFromChange($event)">
        <label for="to" style="margin-right: 10px;">to: </label>
        <input type="date" (change)="handleToChange($event)">
        <button *ngIf="is_admin()" (click)="renameHandler()">Rename</button>
    </form>
</div>
<ag-grid-angular
  style="width: 100%; height: 500px;"
  [rowData]="rowData()"
  [columnDefs]="headings()"
  (gridReady)="handleReady($event)">
</ag-grid-angular>
